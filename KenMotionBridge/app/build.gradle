plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'br.com.onlife.kenmotionbridge'
    compileSdk 34

    defaultConfig {
        applicationId 'br.com.onlife.kenmotionbridge'
        minSdk 22
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildFeatures {
        aidl true
        buildConfig true
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // mesmo applicationId para facilitar instalação no tablet de teste
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // ── RobotSDK do fabricante ──────────────────────────────────────────────
    // Coloque RobotSDK_release_i18n_2_4_0_43.aar (ou o .jar/.aar correspondente)
    // em KenMotionBridge/app/libs/. O fileTree abaixo é "vazio-seguro": o projeto
    // compila mesmo sem o AAR (a ponte usa reflexão em SlamwareChassis.kt).
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])

    // ── Dependências TRANSITIVAS do RobotSDK-client.jar (não vêm embutidas no jar) ──
    // O SDK Slamware usa um WebSocket bridge + Gson + commons-io. Sem elas, a classe
    // com.slamtec.slamware.sdp.SlamwareSdpPlatform / CsjSlamCore falham ao inicializar
    // com NoClassDefFoundError (org.java_websocket.client.WebSocketClient ausente).
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'commons-io:commons-io:2.13.0'

    // ── Caminho REAL do chassi (descoberto via javap): SlamwareCorePlatform.connect
    // delega a com.csjbot.cosclient.CosClientAgent (protocolo CSJBot sobre netty).
    // Sem estas classes o connect degrada no genérico
    // "ConnectionFailException: Connection Failed" mesmo com TCP 1445 aberto.
    implementation 'io.netty:netty-all:4.1.100.Final'
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'org.slf4j:slf4j-nop:1.7.36'
    implementation 'org.greenrobot:eventbus:3.3.1'

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'com.google.android.material:material:1.11.0'

    // MQTT (Paho Java — suporta ssl:// e wss:// para o HiveMQ Cloud)
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'

    // Testes unitários JVM (lógica pura — ex.: backoff de reconexão).
    testImplementation 'junit:junit:4.13.2'
}
