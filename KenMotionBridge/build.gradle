// Top-level build file — KenMotionBridge
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
