name: Build APK

# Gera o APK de debug do KenMotionBridge a cada push/PR e publica como artifact.
#
# IMPORTANTE: o GitHub só executa workflows em `.github/workflows/` na RAIZ do repo.
#  - Se o KenMotionBridge for a raiz do repositório, este arquivo já está no lugar.
#  - Se ele for uma SUBPASTA (ex.: repo/KenMotionBridge), mova este arquivo para
#    `<raiz>/.github/workflows/` e ajuste `PROJECT_DIR` abaixo para `KenMotionBridge`.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  PROJECT_DIR: KenMotionBridge   # projeto fica na subpasta KenMotionBridge/ do repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KenMotionBridge-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
