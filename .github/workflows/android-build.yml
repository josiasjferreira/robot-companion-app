name: Build APK

# Gera o APK de debug do KenMotionBridge e publica como artifact.
#
# O projeto Android fica na subpasta KenMotionBridge/ deste repositório (a raiz
# é o app web Lovable/Capacitor). Só roda quando a ponte muda, para não buildar
# Android a cada alteração no app web.

on:
  push:
    paths:
      - "KenMotionBridge/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "KenMotionBridge/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

env:
  PROJECT_DIR: KenMotionBridge

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KenMotionBridge-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
