name: Build APK

# Gera o APK de debug do KenMotionBridge e publica como artifact.
#
# O projeto Android fica na subpasta KenMotionBridge/ deste repositório (a raiz
# é o app web Lovable/Capacitor). Só roda quando a ponte muda, para não buildar
# Android a cada alteração no app web.

on:
  push:
    paths:
      - "KenMotionBridge/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "KenMotionBridge/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

env:
  PROJECT_DIR: KenMotionBridge

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: KenMotionBridge-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publica o APK como Release com tag FIXA (kenmotion-latest): o link de
      # download fica estável e funciona no celular sem login/GitHub UI:
      #   https://github.com/josiasjferreira/robot-companion-app/releases/download/kenmotion-latest/app-debug.apk
      - name: Publish APK to Release (link estável p/ download no celular)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kenmotion-latest
          name: KenMotionBridge — último APK
          body: "APK de debug mais recente do KenMotionBridge (build automático). Baixe o app-debug.apk abaixo."
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
